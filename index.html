<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Quiz Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    h1 { text-align: center; color: #2c3e50; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .sample-btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .sample-btn {
      background: #e0e6ed;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
    }
    .sample-btn:hover { background: #d0d7de; }
    button.action-btn {
      width: 100%;
      background: #3498db;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button.action-btn:disabled { background: #bdc3c7; }
    #timer-banner {
      display: none;
      position: sticky;
      top: 10px;
      z-index: 100;
      background: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }
    #score-banner {
      display: none;
      background: #27ae60;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    #error-box {
      background: #f8d7da;
      color: #721c24;
      padding: 10px;
      border-radius: 5px;
      margin-top: 15px;
      display: none;
    }
    .question-card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 6px;
      border-left: 4px solid #3498db;
    }
    .option-label {
      display: block;
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .option-label.correct { background: #d4edda; color: #155724; font-weight: bold; }
    .option-label.incorrect { background: #f8d7da; color: #721c24; }
    .explanation {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #eef9f1;
      border-radius: 4px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h1>📄 PDF Quiz Generator</h1>

  <div class="card">
    <h3>Choose a Sample PDF or Upload Your Own:</h3>
    <div class="sample-btn-group">
      <button class="sample-btn" onclick="selectSample('sample.pdf')">📄 Science Sample</button>
      <button class="sample-btn" onclick="selectSample('sample_ai.pdf')">💻 AI & Tech Sample</button>
      <button class="sample-btn" onclick="selectSample('sample_history.pdf')">📜 History Sample</button>
    </div>

    <form id="quiz-form">
      <input type="file" id="pdf-file" accept=".pdf" required />
      <br>
      <button type="submit" id="submit-btn" class="action-btn">Generate 20-Question Quiz</button>
    </form>
    <div id="error-box"></div>
  </div>

  <div id="timer-banner">⏱️ Time Remaining: <span id="timer-clock">15:00</span></div>
  <div id="score-banner"></div>
  <div id="quiz-container"></div>
  <button id="score-btn" class="action-btn" style="display:none;" onclick="calculateScore()">Submit Quiz & Show Score</button>

  <script src="script.js"></script>
</body>
</html>
